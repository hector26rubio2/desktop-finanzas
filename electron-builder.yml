appId: com.finanzas.desktop
productName: Finanzas
copyright: Copyright 2026

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - dist/browser/**/*
  - "!dist/browser/stats.html"

asarUnpack:
  - node_modules/better-sqlite3/**

# Aquí se empaquetaba un fichero de entorno de producción dentro del instalador.
# Nada lo lee ya, y un fichero de secretos dentro de un distribuible es un
# secreto repartido. No volver a añadir extraResources con secretos.

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
  icon: build/icon.icns
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

publish:
  provider: github
  owner: hector26rubio2
  repo: desktop-finanzas
  releaseType: release
