<div class="user-menu-backdrop" (click)="close.emit()"></div>
<div class="user-menu" role="menu">
  <div class="user-menu__header">
    <div class="user-menu__avatar">{{ userInitials() }}</div>
    <div class="user-menu__info">
      <div class="user-menu__name">{{ userName() }}</div>
      <div class="user-menu__mail">{{ userEmail() }}</div>
    </div>
  </div>
  <div class="user-menu__divider"></div>
  <button
    class="user-menu__item"
    role="menuitem"
    (click)="navigate.emit({ path: 'settings', queryParams: { section: 'perfil' } })"
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="8" cy="6" r="2.5" />
      <path d="M3 14c0-3 2.5-4.5 5-4.5s5 1.5 5 4.5" />
    </svg>
    {{ i18n.t('settings.profile') }}
  </button>
  <button class="user-menu__item" role="menuitem" (click)="navigate.emit({ path: 'settings' })">
    <svg
      width="14"
      height="14"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      [innerHTML]="iconSvg('settings')"
    ></svg>
    {{ i18n.t('nav.settings') }}
  </button>
  @if (role.isAdmin()) {
    <button class="user-menu__item" role="menuitem" (click)="navigate.emit({ path: 'admin' })">
      <svg
        width="14"
        height="14"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M8 1l6 3v4c0 4-3 6-6 7-3-1-6-3-6-7V4l6-3z" />
      </svg>
      {{ i18n.t('nav.admin') }}
    </button>
  }
  <div class="user-menu__divider"></div>
  <button
    class="user-menu__item"
    role="menuitem"
    (click)="navigate.emit({ path: 'settings', queryParams: { section: 'apariencia' } })"
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="8" cy="8" r="3" />
      <path d="M8 1v2M8 13v2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M1 8h2M13 8h2M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4" />
    </svg>
    {{ i18n.t('cmdk.change_theme') }}
  </button>
  <button
    class="user-menu__item"
    role="menuitem"
    (click)="navigate.emit({ path: 'settings', queryParams: { section: 'idioma' } })"
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="8" cy="8" r="6.5" />
      <path d="M1.5 8h13M8 1.5c2 2 2 11 0 13M8 1.5c-2 2-2 11 0 13" />
    </svg>
    <span>{{ i18n.t('settings.language') }}</span>
    <span class="user-menu__hint">{{ i18n.currentLocale() }}</span>
  </button>
  <button class="user-menu__item" role="menuitem" (click)="openCmdk.emit()">
    <svg
      width="14"
      height="14"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    >
      <circle cx="7" cy="7" r="5" />
      <path d="M12 12l3 3" />
    </svg>
    <span>{{ i18n.t('common.search') }}</span>
  </button>
  <div class="user-menu__divider"></div>
  <button class="user-menu__item user-menu__item--danger" role="menuitem" (click)="auth.logout()">
    <svg
      width="14"
      height="14"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M6 8h8M11 5l3 3-3 3M10 3H3v10h7" />
    </svg>
    {{ i18n.t('common.sign_out') }}
  </button>
</div>
