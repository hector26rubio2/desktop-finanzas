<header class="content__header">
  <div>
    <div class="eyebrow">{{ headerSub() }}</div>
    <h1 class="content__title-h" style="margin-top: 2px">{{ headerTitle() }}</h1>
  </div>
  <div class="content__h-right">
    <button type="button" class="header-search-btn" (click)="openCmdk.emit()" [attr.title]="i18n.t('common.search')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="7" cy="7" r="5" />
        <path d="M12 12l3 3" />
      </svg>
      <span>{{ i18n.t('common.search') }}</span>
      <span class="kbd">{{ os.kbd('K') }}</span>
    </button>
  </div>
</header>
