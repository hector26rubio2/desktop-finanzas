@if (visible) {
  <div
    class="overlay"
    (click)="closeModal.emit()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="i18n.t('common.search_dialog')"
  >
    <div class="cmdk" (click)="$event.stopPropagation()">
      <div class="cmdk__input-wrap">
        <svg
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          <circle cx="7" cy="7" r="5" />
          <path d="M12 12l3 3" />
        </svg>
        <input
          class="cmdk__input"
          [placeholder]="i18n.t('cmdk.placeholder')"
          [ngModel]="query()"
          (ngModelChange)="onQueryChange($event)"
          (keydown)="onKeydown($event)"
          autofocus
          role="combobox"
          aria-autocomplete="list"
          aria-controls="cmdk-list"
          [attr.aria-expanded]="results().length > 0"
          [attr.aria-activedescendant]="results().length > 0 ? 'cmdk-opt-' + activeIndex() : null"
          [attr.aria-label]="i18n.t('common.search_input')"
        />
        <span class="kbd" style="cursor: pointer" (click)="closeModal.emit()">ESC</span>
      </div>
      <div class="cmdk__list" id="cmdk-list" role="listbox">
        @for (item of results(); track item.kind + item.id; let i = $index) {
          @if (showSection(i)) {
            <div class="cmdk__section">{{ sectionLabel(item.kind) }}</div>
          }
          <div
            class="cmdk__item"
            [class.cmdk__item--active]="i === activeIndex()"
            [id]="'cmdk-opt-' + i"
            role="option"
            [attr.aria-selected]="i === activeIndex()"
            (click)="select(item)"
            (mouseenter)="activeIndex.set(i)"
          >
            <span class="cmdk__item-lbl" [style.color]="item.danger ? 'var(--negative)' : null">{{ item.label }}</span>
            @if (item.sub) {
              <span class="cmdk__item-sub mono">{{ item.sub }}</span>
            }
            @if (item.kbd) {
              <span class="cmdk__item-kbd">{{ item.kbd }}</span>
            }
          </div>
        }
        @if (results().length === 0) {
          <div class="cmdk__empty serif">{{ i18n.t('cmdk.no_results') }}</div>
        }
      </div>
    </div>
  </div>
}
