<div class="view">
  <div class="admin-header">
    <h2>{{ i18n.t('admin.title') }} — {{ i18n.t('admin.users') }}</h2>
    <div class="admin-header-right">
      <button class="btn btn--ghost" (click)="router.navigate(['/movements'])">← {{ i18n.t('common.back') }}</button>
      <button class="btn btn--ghost" (click)="theme.cycleTheme()">{{ i18n.t('common.change_theme') }}</button>
      <button class="btn btn--ghost" style="color: var(--negative)" (click)="auth.logout()">
        {{ i18n.t('common.sign_out') }}
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="loading">{{ i18n.t('common.loading') }}</div>
  }

  @if (!loading()) {
    <ng-template #roleCell let-u>
      <span class="tag" [class]="u.role === 'Admin' ? 'tag--accent' : ''">{{ u.role }}</span>
    </ng-template>
    <ng-template #activeCell let-u>
      <span class="tag" [class]="u.isActive ? 'tag--pos' : 'tag--neg'">
        {{ u.isActive ? i18n.t('admin.active') : i18n.t('admin.inactive') }}
      </span>
    </ng-template>
    <ng-template #createdCell let-u>
      <span class="text-muted text-xs">{{ u.createdAt | date: 'dd/MM/yy' }}</span>
    </ng-template>
    <ng-template #actionsCell let-u>
      <span class="actions">
        <button
          class="btn btn--ghost btn--icon"
          (click)="toggleRole(u)"
          [title]="u.role === 'Admin' ? i18n.t('admin.make_user') : i18n.t('admin.make_admin')"
        >
          @if (u.role === 'Admin') {
            <svg
              width="12"
              height="12"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="8" cy="5" r="3" />
              <path d="M2 14c0-3 3-5 6-5s6 2 6 5" />
            </svg>
          } @else {
            <svg
              width="12"
              height="12"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="5" cy="11" r="3" />
              <path d="M7.5 8.5L14 2M11 5l2 2" />
            </svg>
          }
        </button>
        <button
          class="btn btn--ghost btn--icon"
          [style.color]="u.isActive ? 'var(--negative)' : 'var(--positive)'"
          (click)="toggleActive(u)"
          [title]="u.isActive ? i18n.t('admin.deactivate') : i18n.t('admin.activate')"
        >
          @if (u.isActive) {
            <svg
              width="12"
              height="12"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="8" cy="8" r="6" />
              <path d="M3.8 3.8l8.4 8.4" />
            </svg>
          } @else {
            <svg
              width="12"
              height="12"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path d="M3 8.5l3 3 7-7" />
            </svg>
          }
        </button>
      </span>
    </ng-template>
    <app-data-table
      [columns]="cols()"
      [data]="users()"
      [trackBy]="trackById"
      [totalPages]="0"
      [emptyMessage]="i18n.t('admin.sin_usuarios')"
    />
  }
</div>
