<div role="status" aria-live="polite" aria-atomic="true" class="toast-region">
  @if (notif.message(); as message) {
    <div class="toast">{{ message }}</div>
  }
</div>
<div [class]="isAuthPage() ? '' : 'app-shell' + (sidebarCollapsed() ? ' sidebar-collapsed' : '')">
  @if (!isAuthPage()) {
    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      [activeView]="activeView()"
      (toggleSidebar)="toggleSidebar()"
      (navigateTo)="nav($event)"
      (navigateWithParams)="navWithParams($event)"
      (openCmdk)="showCmdk.set(true)"
    />
  }

  <main [class]="isAuthPage() ? '' : 'content'">
    @if (!isAuthPage() && routeLoading()) {
      <div class="route-progress" role="progressbar" [attr.aria-label]="i18n.t('common.loading')"></div>
    }
    @if (!isAuthPage()) {
      <app-update-banner />
      <app-shell-header [headerTitle]="headerTitle()" [headerSub]="headerSub()" (openCmdk)="showCmdk.set(true)" />
    }

    <div [class]="isAuthPage() ? '' : 'content__body'" [attr.aria-busy]="routeLoading() || null">
      <router-outlet />
    </div>
  </main>
</div>

@if (!isAuthPage()) {
  <app-cmdk
    [visible]="showCmdk()"
    (closeModal)="showCmdk.set(false)"
    (navigateTo)="nav($event)"
    (newMovement)="openNewMovement()"
  />
}
