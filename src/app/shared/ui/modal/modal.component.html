<div
  class="overlay"
  (click)="overlayClick.emit()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="ariaLabel()"
  tabindex="-1"
>
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal__h">
      <span class="modal__title">{{ title() }}</span>
      <button class="btn btn--ghost btn--icon" (click)="closeModal.emit()" aria-label="Close">
        <svg
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M1 1l14 14M15 1L1 15" />
        </svg>
      </button>
    </div>
    <div class="modal__body">
      <ng-content />
    </div>
  </div>
</div>
