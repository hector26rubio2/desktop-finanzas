<div class="kpi-grid">
  @for (card of cards(); track card.label) {
    <div class="kpi-card">
      <div class="eyebrow">{{ card.label }}</div>
      <div class="num-lg mt-8" [style.color]="card.color ?? 'var(--fg-0)'">{{ card.value }}</div>
      @if (card.sub) {
        <div class="num-sm">{{ card.sub }}</div>
      }
    </div>
  }
</div>
