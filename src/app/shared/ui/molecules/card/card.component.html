<div class="card" [class.card--interactive]="interactive()">
  @if (title()) {
    <div class="card__h">
      <span class="card__title">{{ title() }}</span>
      @if (subtitle()) {
        <span class="card__subtitle eyebrow">{{ subtitle() }}</span>
      }
      <ng-content select="[card-actions]" />
    </div>
  }
  <div class="card__body">
    <ng-content />
  </div>
</div>
