<dialog
  #dialog
  class="overlay"
  aria-modal="true"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-labelledby]="!ariaLabel() && title() ? titleId : null"
  tabindex="-1"
  (click)="onOverlayClick($event)"
  (keydown.escape)="onEscape($event)"
  (cancel)="onEscape($event)"
>
  <div class="modal" [class.modal--lg]="size() === 'lg'">
    <div class="modal__h">
      <span class="modal__title" [id]="titleId">{{ title() }}</span>
      <button
        class="btn btn--ghost btn--icon"
        (click)="closeModal.emit()"
        [attr.aria-label]="i18n.localize('Cerrar', 'Close', 'Fechar')"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M1 1l14 14M15 1L1 15" />
        </svg>
      </button>
    </div>
    <div class="modal__body">
      <ng-content />
    </div>
  </div>
</dialog>
