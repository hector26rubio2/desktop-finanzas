@if (open()) {
  <button
    type="button"
    class="inspector-backdrop"
    [attr.aria-label]="i18n.localize('Cerrar', 'Close', 'Fechar')"
    (click)="closed.emit()"
  ></button>
  <aside class="inspector" role="dialog" aria-modal="true" [attr.aria-label]="title()">
    <header>
      <div>
        <h2>{{ title() }}</h2>
        <p>{{ subtitle() }}</p>
      </div>
      <button
        class="btn btn--ghost btn--icon"
        (click)="closed.emit()"
        [attr.aria-label]="i18n.localize('Cerrar', 'Close', 'Fechar')"
      >
        ×
      </button>
    </header>
    @for (section of sections(); track section.title) {
      <section>
        <h3>{{ section.title }}</h3>
        <dl>
          @for (row of section.rows; track row.label) {
            <div>
              <dt>{{ row.label }}</dt>
              <dd>{{ row.value }}</dd>
            </div>
          }
        </dl>
      </section>
    }
    @if (actions().length) {
      <footer>
        @for (item of actions(); track item.id) {
          <button class="btn" [class.btn--danger]="item.danger" (click)="action.emit(item.id)">{{ item.label }}</button>
        }
      </footer>
    }
  </aside>
}
